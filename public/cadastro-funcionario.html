<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Funcionários</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="cabecalho-card">
        <span class="icone">👤</span>
        <div>
          <h1>Cadastro de Funcionários</h1>
          <p>Preencha os dados para cadastrar um novo funcionário.</p>
        </div>
      </div>

      <div id="mensagem"></div>

      <form action="/funcionarios" method="POST" autocomplete="off">
        <label for="nome">Nome do funcionário</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Ana Souza" required>

        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" name="cargo" placeholder="Ex: Desenvolvedora Jr." required>

        <label for="salario">Salário</label>
        <input type="number" id="salario" name="salario" placeholder="Ex: 2500" step="0.01" min="0" required>

        <button type="submit">Cadastrar Funcionário</button>
      </form>

      <p class="texto-ajuda">
        Após clicar no botão, os dados deverão ser enviados para o Back-End e salvos no banco MySQL.
      </p>
    </section>
  </main>

  <script src="js/cadastro-funcionario.js"></script>
</body>
</html>
